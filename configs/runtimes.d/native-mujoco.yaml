schema_version: 1
installation_id: local-native-mujoco
development: true
profile:
  runtime_profile_id: native-mujoco
  name: Native MuJoCo
  engine: mujoco
  loader: native
  api_version: v1
  scene_kinds: [scene_document, asset_scene]
  capabilities:
    editable_scene: true
    native_evaluator: false
    viewer: true
    viewer_camera_modes: [free, fixed]
    scene_step: true
    scene_reset: true
    robot_models: [r1_pro_chassis]
    sensor_kinds: [rgb, depth, contact, holding, robot_state]
launch_mode: uv
endpoint: http://127.0.0.1:8090
workdir: ${SEMANTIC_MUJOCO_WORKDIR}
command: [uv, run, --frozen, plugin-mujoco]
environment_refs:
  MUJOCO_ASSET_ROOT: SEMANTIC_MUJOCO_ASSET_ROOT
  MUJOCO_GL: SEMANTIC_MUJOCO_GL
asset_data_mounts:
  - kind: assets
    source: ${SEMANTIC_MUJOCO_ASSET_ROOT}
    target: /assets
    read_only: true
hardware_requirements:
  cpu: x86_64
enabled: true
installed_version: 0.4.0-dev
