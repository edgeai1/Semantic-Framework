<text x="48" y="64" font-size="34" fill="#172c40" text-anchor="start" class="title">Semantic 系统架构</text><text x="48" y="101" font-size="20" fill="#52677a" text-anchor="start" class="body">从目标规划到物理执行，共享任务状态与执行反馈。</text><rect x="48" y="132" width="744" height="99" rx="16" fill="white" stroke="#d6e1ec"/><text x="72" y="173" font-size="27" fill="#3268d8" text-anchor="start" class="title">Semantic Studio</text><text x="72" y="207" font-size="20" fill="#52677a" text-anchor="start" class="body">对话 · 计划 · 工作流 · 场景 · 执行记录</text><rect x="840" y="132" width="312" height="99" rx="16" fill="#f4f0ff" stroke="#ded4f5"/><text x="864" y="173" font-size="25" fill="#7251a3" text-anchor="start" class="title">模型服务</text><text x="864" y="207" font-size="18" fill="#52677a" text-anchor="start" class="body">OpenAI-compatible · Claude</text><path d="M420 234 V273" fill="none" stroke="#72899f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M996 234 V273" fill="none" stroke="#72899f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="48" y="280" width="1104" height="187" rx="16" fill="#e9f0ff" stroke="#bcd0f5"/><text x="72" y="321" font-size="27" fill="#3268d8" text-anchor="start" class="title">Semantic Server</text><rect x="72" y="341" width="336" height="77" rx="10" fill="white" stroke="#ccdbf5"/><text x="88" y="371" font-size="23" fill="#172c40" text-anchor="start" class="title">Leader</text><text x="88" y="401" font-size="18" fill="#52677a" text-anchor="start" class="body">理解目标与环境</text><rect x="432" y="341" width="336" height="77" rx="10" fill="white" stroke="#ccdbf5"/><text x="448" y="371" font-size="23" fill="#172c40" text-anchor="start" class="title">Plan → Workflow</text><text x="448" y="401" font-size="18" fill="#52677a" text-anchor="start" class="body">编排任务与依赖</text><rect x="792" y="341" width="336" height="77" rx="10" fill="white" stroke="#ccdbf5"/><text x="808" y="371" font-size="23" fill="#172c40" text-anchor="start" cla