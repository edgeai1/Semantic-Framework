<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc">
<title id="title">The Semantic system</title><desc id="desc">Studio → Server → Pilot ↔ Robot Skill; Pilot → AbilityFramework → Robot SDK → MuJoCo / hardware.</desc>
