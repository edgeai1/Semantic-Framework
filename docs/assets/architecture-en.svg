<rect width="1200" height="910" rx="24" fill="url(#background)"/>
<text x="48" y="64" font-size="34" fill="#172c40" text-anchor="start" class="title">The Semantic system</text><text x="48" y="101" font-size="20" fill="#52677a" text-anchor="start" class="body">From goal planning to physical execution, with shared state and feedback.</text><rect x="48" y="132" width="744" height="99" rx="16" fill="white" stroke="#d6e1ec"/><text x="72" y="173" font-size="27" fill="#3268d8" text-anchor="start" class="title">Semantic Studio</text><text x="72" y="207" font-size="20" fill="#52677a" text-anchor="start" class="body">Conversation · Plans · Workflows · Scenes · Execution</text><rect x="840" y="132" width="312" height="99" rx="16" fill="#f4f0ff" stroke="#ded4f5"/><text x="864" y="173" font-size="25" fill="#7251a3" text-anchor="start" class="title">Model providers</text><text x="864" y="207" font-size="18" fill="#52677a" text-anchor="start" class="body">OpenAI-compatible · Claude</text><path d="M420 234 V273" fill="none" stroke="#72899f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M996 234 V273" fill="none" stroke="#72899f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="48" y="280" width="1104" height="187" rx="16" fill="#e9f0ff" stroke="#bcd0f5"/><text x="72" y="321" font-size="27" fill="#3268d8" text-anchor="start" class="title">Semantic Server</text><rect x="72" y="341" width="336" height="77" rx="10" fill="white" stroke="#ccdbf5"/><text x="88" y="371" font-size="23" fill="#172c40" text-anchor="start" class="title">Leader</text><text x="88" y="401" font-size="18" fill="#52677a" text-anchor="start" class="body">Goal &amp; environment reasoning</text><rect x="432" y="341" width="336" height="77" rx="10" fill="white" stroke="#ccdbf5"/><text x="448" y="371" font-size="23" fill="#172c40" text-anchor="start" class="title">Plan → Workflow</text><text x="448" y="401" font-size="18" fill="#52677a" text-anchor="start" class="body">Tasks &amp; dependencies</text><rect x="792" y="341" width="336" height="77" rx="10" fill="white" stroke="#ccdbf5"/><text x="808" y="371" font-size="23" fill="#172c40" text-anchor="start" class="title">Robot Agent</text><text x="808" y="401" font-size="18" fill="#52677a" text-anchor="start" class="body">Skill selection &amp; subtasks</text><text x="72" y="445" font-size="19" fill="#52677a" text-anchor="start" class="body">Projects · Semantic maps · Skill registry · Runtime lifecycle · Events &amp; artifacts</text><text x="209" y="500" font-size="17" fill="#52677a" text-anchor="start" class="body">Tasks / execution events</text><rect x="48" y="524" width="744" height="288" rx="16" fill="#f3faf7" stroke="#b9dbce"/><path d="M182 470 V545" fill="none" stroke="#72899f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="72" y="552" width="220" height="78" rx="16" fill="white" stroke="#d6e1ec"/><text x="92" y="585" font-size="26" fill="#14796b" text-anchor="start" class="title">Pilot</text><text x="92" y="614" font-size="18" fill="#52677a" text-anchor="start" class="body">Execution bridge</text><rect x="412" y="552" width="356" height="78" rx="16" fill="white" stroke="#d6e1ec"/><text x="432" y="585" font-size="26" fill="#14796b" text-anchor="start" class="title">Robot Skill</text><text x="432" y="614" font-size="18" fill="#52677a" text-anchor="start" class="body">Stages · Observe · Act · Check</text><path d="M295 590 H405" fill="none" stroke="#72899f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="350" y="572" font-size="16" fill="#52677a" text-anchor="middle" class="body">SDK</text><path d="M182 634 V686" fill="none" stroke="#72899f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="207" y="667" font-size="17" fill="#52677a" text-anchor="start" class="body">Action</text><rect x="72" y="694" width="292" height="78" rx="16" fill="white" stroke="#d6e1ec"/><text x="92" y="727" font-size="25" fill="#14796b" text-anchor="start" class="title">AbilityFramework</text><text x="92" y="756" font-size="18" fill="#52677a" text-anchor="start" class="body">Runs Ability instances</text><rect x="448" y="694" width="320" height="78" rx="16" fill="white" stroke="#d6e1ec"/><text x="468" y="727" font-size="25" fill="#14796b" text-anchor="start" class="title">Robot SDK</text><text x="468" y="756" font-size="18" fill="#52677a" text-anchor="start" class="body">State · Control · Sensors</text><path d="M368 733 H440" fill="none" stroke="#72899f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="72" y="797" font-size="17" fill="#14796b" text-anchor="start" class="body">Robot execution environment · Robot Bundle</text><rect x="840" y="524" width="312" height="288" rx="16" fill="#fff9ee" stroke="#ead3a8"/><text x="864" y="565" font-size="23" fill="#926423" text-anchor="start" class="title">Environment &amp; devices</text><rect x="860" y="588" width="272" height="79" rx="10" fill="white" stroke="#eadfc9"/><text x="878" y="620" font-size="23" fill="#172c40" text-anchor="start" class="title">MuJoCo Runtime</text><text x="878" y="649" font-size="18" fill="#52677a" text-anchor="start" class="body">Scenes · Assets · Physics</text><rect x="860" y="696" width="272" height="79" rx="10" fill="white" stroke="#eadfc9"/><text x="878" y="728" font-size="23" fill="#172c40" text-anchor="start" class="title">Physical robots</text><text x="878" y="757" font-size="18" fill="#52677a" text-anchor="start" class="body">Model adapters · Backends</text><path d="M772 733 H852" fill="none" stroke="#72899f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M814 733 V627 H852" fill="none" stroke="#72899f" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="863" font-size="19" fill="#52677a" text-anchor="start" class="body">Feedback returns along the execution chain; Studio brings scene state, skill progress, and artifacts together.</text></svg>
