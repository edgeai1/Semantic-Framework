# 沿用默认规则。白名单必须挂在 generic-api-key 上，全局 allowlists
# 在 useDefault 时不会合并，扫历史提交也不生效。
title = "semantic-framework"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "产品场景标识和测试占位 key，不是密钥"
regexTarget = "secret"
regexes = [
  '''palletizing_depalletizing_''',
  '''sk-abcdef123456''',
  '''sk-test12345678''',
  '''sk-testkey123456''',
  '''sk-test''',
]
